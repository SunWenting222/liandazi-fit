name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore prebuilt site
        run: |
          cat source-bundle.tar.gz.b64 source-bundle.part01.b64 source-bundle.part02.b64 source-bundle.part03.b64 > site-bundle.tar.gz.b64
          base64 -d site-bundle.tar.gz.b64 > site-bundle.tar.gz
          mkdir -p dist
          tar -xzf site-bundle.tar.gz -C dist
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
